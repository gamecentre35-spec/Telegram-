<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pro Video Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Lobster&family=Bebas+Neue&family=Anton&family=Permanent+Marker&family=Dancing+Script&family=Orbitron&family=Righteous&family=Playfair+Display&family=Caveat&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--surface:#1e1e1e;--text:#fff;--muted:#888;--cyan:#00d2d3;--border:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body,html{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.top-bar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.left-controls,.right-controls{display:flex;gap:14px;align-items:center}
.icon-btn{background:none;border:none;color:var(--text);cursor:pointer;padding:4px;display:flex}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--cyan);color:#000;font-weight:600;border:none;border-radius:6px;padding:8px 16px;font-size:14px}
.quality-btn{background:var(--surface);border:none;color:var(--text);font-size:13px;padding:8px 10px;border-radius:6px}
.preview-container{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:200px}
.video-wrapper{position:relative;width:100%;height:100%;overflow:hidden}
#mainVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;touch-action:none;display:none}
#ovFrame{position:absolute;z-index:2;display:none;touch-action:none;border:1.5px solid var(--cyan);cursor:move}
#overlayVideo{display:block;width:100%;height:auto;pointer-events:none}
#ovHandle{position:absolute;right:-8px;bottom:-8px;width:20px;height:20px;border-radius:50%;background:var(--cyan);border:2px solid #000;touch-action:none}
#textLayer{position:absolute;inset:0;z-index:5;pointer-events:none}
.txt{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;touch-action:none;font-weight:700;padding:2px 8px;border-radius:4px;white-space:pre;cursor:move}
.controls{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.play-btn{background:none;border:none;color:var(--text);display:flex}
.play-btn svg{width:30px;height:30px;fill:currentColor;stroke:none}
.controls-right{display:flex;gap:20px;width:70px;justify-content:flex-end}
.controls-right button{color:var(--text);background:none;border:none;display:flex}
.timebar{display:flex;justify-content:space-between;padding:0 16px;font-size:12px;height:22px;font-variant-numeric:tabular-nums;flex-shrink:0}
.timeline-container{flex:1;position:relative;overflow:hidden;min-height:150px;max-height:38vh;display:flex;flex-direction:column}
.timeline-scroll{flex:1;overflow:auto;display:flex;touch-action:pan-x pan-y;scrollbar-width:none}
.timeline-scroll::-webkit-scrollbar{display:none}
.track-lanes{position:relative;display:flex;flex-direction:column;min-width:100%;padding:0 50%;flex-shrink:0}
.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;z-index:10;pointer-events:none;transform:translateX(-1px)}
.playhead::before{content:'';position:absolute;top:0;left:-4px;width:10px;height:10px;background:#fff;border-radius:50%}
.ruler{position:relative;height:20px;flex-shrink:0;color:var(--muted);font-size:10px}
.ruler span{position:absolute;top:4px;transform:translateX(-50%)}
.track{position:relative;margin-bottom:4px;flex-shrink:0}
.video-track{height:54px}.overlay-track{height:38px}.text-track{height:28px}.audio-track{height:34px}
.clip{position:absolute;height:100%;border-radius:4px;overflow:hidden;display:flex;align-items:center;border:1px solid #333}
.video-clip{background:#222}
.thumb-strip{display:flex;width:100%;height:100%;overflow:hidden;pointer-events:none}
.thumb-strip img{height:100%;flex-shrink:0;object-fit:cover}
.audio-clip{background:rgba(0,210,211,.2);border-color:var(--cyan);color:var(--cyan);font-size:11px;padding:0 8px;white-space:nowrap}
.overlay-clip{background:#2b2b2b;border-color:#777}
.text-clip{background:#6a4bd8;border-color:#9a85f0;font-size:11px;padding:0 8px;white-space:nowrap}
.clip.selected{border:2px solid var(--cyan);box-shadow:0 0 8px rgba(0,210,211,.4);z-index:5}
.joint{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;background:#fff;color:#000;border:none;border-radius:7px;z-index:6;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.joint svg{width:15px;height:15px;stroke-width:2.4}
.empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty-btn-group{display:flex;flex-direction:column;gap:12px;align-items:flex-start;transform:translateX(30px);pointer-events:auto}
.empty-btn{background:none;border:none;color:var(--muted);display:flex;align-items:center;gap:8px;font-size:13px}
.empty-btn svg{width:18px;height:18px}
.empty-btn.big{background:var(--surface);border:1px solid var(--border);padding:12px 16px;border-radius:8px;font-size:14px;color:var(--text)}
.bottom-menu{height:62px;display:flex;align-items:center;overflow-x:auto;border-top:1px solid var(--border);padding:0 8px;flex-shrink:0;scrollbar-width:none}
.menu-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);background:none;border:none;padding:8px 12px;font-size:10px;min-width:64px}
.menu-item.active{color:var(--cyan)}
.menu-item svg{width:22px;height:22px}
.sub-panel{position:absolute;bottom:62px;left:0;right:0;background:var(--bg);padding:14px 16px;display:none;flex-direction:column;border-top:1px solid var(--border);z-index:20;max-height:55vh;overflow-y:auto}
.sub-panel.show{display:flex}
.sub-panel-header{display:flex;justify-content:space-between;margin-bottom:10px}
.sub-panel-input{background:var(--surface);border:none;color:#fff;padding:12px;border-radius:8px;width:100%;font-size:15px;outline:none}
.size-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.size-row input{flex:1;accent-color:var(--cyan)}
.sub-tabs{display:flex;gap:18px;margin:14px 0 10px;color:var(--muted);font-size:14px}
.sub-tab.active{color:var(--text);border-bottom:2px solid var(--cyan);padding-bottom:4px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.style-btn{min-width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;border:2px solid transparent;background:#333;flex-shrink:0}
.style-btn.active{border-color:#fff}
.color-swatch{width:32px;height:32px;border-radius:50%;border:2px solid #555;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#aaa}
.color-swatch.active{border-color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:500px;border-radius:20px 20px 0 0;padding:24px 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:18px;margin-bottom:16px;text-align:center}
.ratio-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ratio-btn{background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:16px;color:#fff;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ratio-btn.active{border-color:var(--cyan);color:var(--cyan)}
.ratio-icon{border:2px solid currentColor;border-radius:2px}
.btn-cancel{margin-top:20px;width:100%;padding:14px;border-radius:8px;border:none;background:#333;color:#fff;font-weight:600}
.hidden{display:none!important} .controls-right{width:110px;gap:14px} .clip.selected{touch-action:none} .handle{position:absolute;top:0;bottom:0;width:16px;background:#fff;z-index:7;touch-action:none;display:flex;align-items:center;justify-content:center} .handle::after{content:'';width:2px;height:14px;background:#555;border-radius:1px} .handle.l{left:0;border-radius:4px 0 0 4px} .handle.r{right:0;border-radius:0 4px 4px 0} .kf{position:absolute;bottom:2px;width:8px;height:8px;margin-left:-4px;background:#ffd60a;transform:rotate(45deg);z-index:8;pointer-events:none} .gl{font-size:20px;line-height:22px;height:22px} #textSubPanel{padding:8px 12px;max-height:36vh} #textSubPanel .sub-panel-header{margin-bottom:6px} #textSubPanel .sub-panel-input{padding:8px 10px;font-size:14px} .icon-btn.active{color:var(--cyan)} .agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px} .acell{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:#bbb} .acell.active{color:var(--cyan)} .aprev{width:100%;aspect-ratio:1;background:#222;border-radius:8px;overflow:hidden;position:relative;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:20px} .acell.active .aprev{border-color:var(--cyan)} .pimg{position:absolute;inset:14%;width:72%;height:72%;object-fit:cover;border-radius:6px} .ptxt{position:absolute;left:50%;top:50%;font-weight:700;font-size:22px;color:#fff;white-space:nowrap} .ttab{padding:6px 12px;border-radius:14px;background:#2a2a2a;font-size:13px;flex-shrink:0;color:#ccc} .ttab.active{background:var(--cyan);color:#000} 
input[type=file]{display:none}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="left-controls">
      <button class="icon-btn" id="closeBtn"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <button class="icon-btn" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
    </div>
    <div class="right-controls">
      <button class="quality-btn" id="qualityBtn">720p ▾</button>
      <button class="btn-primary" id="exportBtn">Export</button>
    </div>
  </div>

  <div class="preview-container" id="previewContainer">
    <div class="video-wrapper" id="videoWrapper">
      <video id="mainVideo" playsinline></video>
      <div id="ovFrame"><video id="overlayVideo" playsinline muted></video><div id="ovHandle"></div></div>
      <div id="textLayer"></div>
    </div>
  </div>

  <div class="controls">
    <div id="clipCtl" style="width:110px;display:flex;gap:10px;align-items:center;visibility:hidden"><button class="icon-btn" id="revBtn"><svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg></button><button class="quality-btn" id="spdBtn">1x</button></div>
    <button class="play-btn" id="playBtn"></button>
    <div class="controls-right">
      <button id="kfBtn"><svg viewBox="0 0 24 24"><path d="M12 3l9 9-9 9-9-9z"/></svg></button><button id="splitBtn"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></button>
      <button id="delBtn"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg></button>
    </div>
  </div>

  <div class="timebar"><span id="currentTime">00:00</span><span id="totalDuration">00:00</span></div>

  <div class="timeline-container">
    <div class="timeline-scroll" id="timelineScroll">
      <div class="track-lanes" id="trackLanes">
        <div class="ruler" id="ruler"></div>
        <div class="track video-track" id="videoTrack"></div>
        <div class="track overlay-track" id="overlayTrack"></div>
        <div class="track text-track" id="textTrack"></div>
        <div class="track audio-track" id="audioTrack"></div>
      </div>
    </div>
    <div class="playhead"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-btn-group">
        <button class="empty-btn big" id="emptyAddVideo"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Tap to add video</button>
        <button class="empty-btn" id="emptyAddAudio"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add audio</button>
        <button class="empty-btn" id="emptyAddText"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add text</button>
      </div>
    </div>
  </div>

  <div class="sub-panel" id="textSubPanel">
    <div class="sub-panel-header">
      <button class="icon-btn" id="textCancel"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      <button class="icon-btn" id="textOk"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></button>
    </div>
    <input type="text" id="textInput" class="sub-panel-input" placeholder="Enter text">
    <div class="size-row">Size <input type="range" id="sizeIn" min="14" max="72" value="28"></div>
    <div class="size-row">Stroke <input type="range" id="swIn" min="0" max="6" step=".5" value="1.5"> Opacity <input type="range" id="saIn" min="0" max="1" step=".05" value="1"></div><div class="row" style="margin-top:10px"><div class="style-btn" id="bBtn">B</div><div class="style-btn" id="iBtn" style="font-style:italic">I</div><div class="style-btn" id="shBtn" style="padding:0 12px;font-size:13px">Shadow</div></div><div class="sub-tabs" id="tgtTabs">
      <div class="sub-tab active" data-t="color">Text</div>
      <div class="sub-tab" data-t="stroke">Stroke</div>
      <div class="sub-tab" data-t="bg">Background</div>
    </div>
    <div class="row" id="colorRow"></div>
    <div class="sub-tabs"><div class="sub-tab active">Styles</div></div>
    <div class="row" id="styleRow"></div>
  </div>

  <div class="sub-panel" id="toolPanel"></div><div class="bottom-menu hidden" id="clipMenu"></div><div class="bottom-menu" id="mainMenu">
    <button class="menu-item" id="btnRatio"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/></svg>Ratio</button>
    <button class="menu-item" id="btnAudio"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Audio</button>
    <button class="menu-item" id="btnText"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>Text</button>
    <button class="menu-item" id="btnEffects"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>Effects</button>
    <button class="menu-item" id="btnOverlay"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="11" y="11" width="7" height="7"/></svg>Overlay</button>
  </div>
</div>

<input type="file" id="inputMainVideo" accept="video/*">
<input type="file" id="inputOverlay" accept="video/*" multiple>
<input type="file" id="inputAudio" accept="audio/*" multiple>
<div class="modal" id="modal"><div class="sheet" id="modalSheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const mainVideo=$('mainVideo'), ovFrame=$('ovFrame'), ovVideo=$('overlayVideo'), ovHandle=$('ovHandle'), textLayer=$('textLayer');
const wrap=$('videoWrapper'), prev=$('previewContainer'), tScroll=$('timelineScroll'), lanes=$('trackLanes'), ruler=$('ruler');
const vTrack=$('videoTrack'), oTrack=$('overlayTrack'), tTrack=$('textTrack'), aTrack=$('audioTrack');
const emptyState=$('emptyState'), playBtn=$('playBtn'), modal=$('modal'), sheet=$('modalSheet'), panel=$('textSubPanel'), textInput=$('textInput'), sizeIn=$('sizeIn');

let PX=60, segments=[], overlays=[], audios=[], texts=[];
let selType=null, selId=null, playing=false, ratio='original', hist=[], hi=-1, n=1;
let mt={x:0,y:0,scale:1}, activeOv=null, editId=null, isNew=false, backup=null, tgt='color';
const thumbs={}, pending={};
const uid=()=>n++;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=s=>(!s||isNaN(s))?'00:00':String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
let tt; const toast=m=>{const t=$('toast');t.textContent=m;t.getAnimations().forEach(a=>a.cancel());t.classList.add('show');playAnim(t,AN.toast_in);clearTimeout(tt);tt=setTimeout(()=>{const a=playAnim(t,AN.toast_out);if(a)a.onfinish=()=>{t.classList.remove('show');a.cancel()};else t.classList.remove('show')},2200)};
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';
playBtn.innerHTML=PLAY;

// ---------- time helpers ----------
const total=()=>segments.reduce((s,x)=>s+sdur(x),0);
const extent=()=>Math.max(1,total(),...overlays.map(o=>o.start+o.duration),...audios.map(a=>a.start+a.duration),...texts.map(t=>t.start+t.dur));
let ci=0;const gs0=i=>segments.slice(0,i).reduce((s,x)=>s+sdur(x),0);
const cur=()=>{if(!segments.length)return 0;ci=Math.min(ci,segments.length-1);const s=segments[ci];return gs0(ci)+clamp(s2l(s,mainVideo.currentTime),0,sdur(s))};
function seekGlobal(t){let l=t;for(let i=0;i<segments.length;i++){const s=segments[i],d=sdur(s);if(l<=d||i===segments.length-1){ci=i;mainVideo.currentTime=l2s(s,Math.min(l,d));return}l-=d}}
const scrollTo=t=>{tScroll.scrollLeft=t*PX};

// ---------- history ----------
const cl=a=>JSON.parse(JSON.stringify(a));const snap=()=>({seg:cl(segments),ov:cl(overlays),au:audios.map(a=>({...a})),tx:cl(texts),mt:{...mt},ratio});
function save(){hist=hist.slice(0,hi+1);hist.push(snap());hi++}
$('undoBtn').onclick=()=>{
  if(hi<=0)return toast('Nothing to undo');
  audios.forEach(a=>a.player.pause());
  const s=hist[--hi];
  segments=cl(s.seg);overlays=cl(s.ov);audios=s.au.map(x=>({...x}));texts=cl(s.tx);
  mt={...s.mt};ratio=s.ratio;selType=null;
  applyMT();applyRatio();renderTracks();syncAll();toast('Undo');
};

// ---------- thumbnails ----------
const wait=(el,ev)=>new Promise(r=>{const f=()=>{el.removeEventListener(ev,f);r()};el.addEventListener(ev,f);setTimeout(f,1500)});
async function ensureThumbs(url){
  if(thumbs[url]||pending[url])return; pending[url]=true;
  try{
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
    await wait(v,'loadeddata');
    const dur=v.duration||1, cnt=clamp(Math.ceil(dur),6,30), h=54, w=Math.round(h*((v.videoWidth||16)/(v.videoHeight||9)));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),imgs=[];
    for(let k=0;k<cnt;k++){v.currentTime=(k+.5)*dur/cnt;await wait(v,'seeked');x.drawImage(v,0,0,w,h);imgs.push(c.toDataURL('image/jpeg',.6))}
    thumbs[url]={imgs,w,dur};
  }catch(e){}
  renderTracks();
}
function strip(el,url,a,b,w,rev){
  const s=document.createElement('div');s.className='thumb-strip';el.appendChild(s);
  const th=thumbs[url]; if(!th){ensureThumbs(url);return}
  const cnt=Math.ceil(w/th.w);
  for(let k=0;k<cnt;k++){
    const t=rev?b-(k+.5)/cnt*(b-a):a+(k+.5)/cnt*(b-a), im=new Image();
    im.src=th.imgs[Math.min(th.imgs.length-1,Math.floor(t/th.dur*th.imgs.length))];
    im.style.width=th.w+'px';s.appendChild(im);
  }
}

// ---------- timeline render ----------
function mk(cls,left,w,type,id){
  const el=document.createElement('div');el.className='clip '+cls;
  el.style.left=left+'px';el.style.width=Math.max(w,4)+'px';
  if(selType===type&&selId===id)el.classList.add('selected');
  const sel=selType===type&&selId===id,it=getIt(type,id);
  el.onclick=e=>{e.stopPropagation();if(dragged)return;selType=type;selId=id;renderTracks();if(type==='text')openText(id)};
  if(it&&it.kf)it.kf.forEach(k=>{const d=document.createElement('i');d.className='kf';d.style.left=(k.t*PX)+'px';el.appendChild(d)});
  if(sel){

async function dlBlobURL(url,mime,cb){
  const r=await fetch(url);if(!r.ok)throw new Error('FFMPEG_FETCH');
  const len=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
  for(;;){const{done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;if(len&&cb)cb(got/len)}
  return URL.createObjectURL(new Blob(ch,{type:mime}));
}
function getFF(){
  if(ffI)return Promise.resolve(ffI);if(ffP)return ffP;
  ffP=(async()=>{
    rvUI(null,'Loading FFmpeg engine (about 30 MB, only the first time)...',0);
    let core,wasm,worker=null,err=null;
    for(const B of [['ffmpeg/','ffmpeg/'],[FF_BASE,CORE_BASE]]){
      try{
        worker=null;await loadScript(B[0]+'ffmpeg.js');
        core=await dlBlobURL(B[1]+'ffmpeg-core.js','text/javascript');
        wasm=await dlBlobURL(B[1]+'ffmpeg-core.wasm','application/wasm',f=>rvUI(null,null,f*100));
        try{worker=await dlBlobURL(B[0]+'814.ffmpeg.js','text/javascript')}catch(e){}
        err=null;break;
      }catch(e){err=e}
    }
    if(err)throw err;
    const mk=async o=>{const f=new FFmpegWASM.FFmpeg();await f.load(o);return f};
    try{ffI=await mk(worker?{coreURL:core,wasmURL:wasm,classWorkerURL:worker}:{coreURL:core,wasmURL:wasm})}
    catch(e){if(!worker)throw e;ffI=await mk({coreURL:core,wasmURL:wasm})}

  })().finally(()=>{ffP=null});

}
async function runFF(ff,a){const r=await ff.exec(a);if(r!==0)throw new Error('FFMPEG_EXEC '+r)}

  if(/memory|out of bounds|RuntimeError|abort|allocation|OOM/i.test(m))return 'Memory khatam ho gayi. Video bahut badi hai - pehle trim karke chhota karo ya 720p video use karo.';
  if(/FFMPEG_SCRIPT|FFMPEG_FETCH|Failed to fetch|NetworkError|importScripts|Worker|Content Security|CSP/i.test(m))return 'FFmpeg engine load nahi ho paya. Claude ke preview mein security (CSP) ki wajah se FFmpeg block hota hai. Is page ko apni hosting (GitHub Pages / Netlify) ya local server par kholo, ya ffmpeg/ folder mein 4 files rakho.';
